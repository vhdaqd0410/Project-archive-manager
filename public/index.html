<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>项目档案管理器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;font-size:13px;background:#f1f5f9;color:#1e293b;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#header{height:50px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
#header .logo{font-size:16px;font-weight:700}
#header input{width:160px;height:30px;border:1px solid #e2e8f0;border-radius:6px;padding:0 10px;font-size:12px;outline:none}
#header input:focus{border-color:#3b82f6}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:240px;background:#1e293b;color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-hdr{padding:12px 14px;font-weight:600;font-size:13px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between}
.sidebar-hdr .badge{background:#3b82f6;color:#fff;font-size:11px;padding:1px 8px;border-radius:10px}
#sidebar input{margin:6px 8px;padding:5px 10px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.06);color:#e2e8f0;font-size:12px;outline:none}
#projectList{flex:1;overflow-y:auto}
#projectList .cat-label{padding:6px 12px;font-size:11px;font-weight:600;color:#94a3b8;cursor:pointer;user-select:none}
#projectList .cat-label .arr{display:inline-block;transition:transform .15s}
#projectList .cat-label.folded .arr{transform:rotate(-90deg)}
#projectList .item{padding:8px 20px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent}
#projectList .item:hover{background:#2d3a4e}
#projectList .item.sel{background:#334155;border-left-color:#3b82f6;color:#fff}
#projectList .item.done{opacity:.5}
#projectList .item.done.sel{opacity:.8}
.sidebar-btns{display:flex;flex-wrap:wrap;gap:3px;padding:8px;border-top:1px solid rgba(255,255,255,.06)}
#rightPanel{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
#rightPanel .empty{flex:1;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:14px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-hdr{padding:10px 14px;font-weight:600;font-size:13px;border-bottom:1px solid #f1f5f9}
.card-body{padding:10px 14px}
.info-row{display:flex;align-items:center;padding:3px 0;gap:8px;font-size:12px}
.info-row .lbl{width:50px;color:#94a3b8;flex-shrink:0}
.info-row .val{font-family:Consolas,monospace;word-break:break-all}
.act-bar{display:flex;flex-wrap:wrap;gap:6px}
.pending-list{max-height:220px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;margin:4px 0}
.pending-list .pi{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid #f1f5f9;font-size:12px}
.pending-list .pi:last-child{border-bottom:none}
.pending-list .pi:hover{background:#f8fafc}
.pending-list input[type=checkbox]{accent-color:#3b82f6}
.pending-list .empty{padding:20px;text-align:center;color:#94a3b8;font-size:12px}
.btn{display:inline-flex;align-items:center;gap:3px;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:.15s;white-space:nowrap}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-accent{background:#7c3aed;color:#fff}.btn-accent:hover{background:#6d28d9}
.btn-warn{background:#f59e0b;color:#fff}.btn-warn:hover{background:#d97706}
.btn-outline{background:#fff;color:#475569;border:1px solid #e2e8f0}.btn-outline:hover{background:#f8fafc}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
#statusBar{height:26px;padding:0 12px;display:flex;align-items:center;background:#fff;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;flex-shrink:0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none;justify-content:center;align-items:center}
.modal-box{background:#fff;border-radius:8px;width:520px;max-height:85vh;overflow-y:auto}
.modal-hdr{padding:12px 16px;font-weight:600;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between}
.modal-body{padding:16px}
.modal-btns{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.fg{margin-bottom:10px}.fg label{display:block;font-size:12px;color:#64748b;margin-bottom:2px}
.fg input,.fg select{width:100%;height:32px;border:1px solid #e2e8f0;border-radius:6px;padding:0 10px;font-size:13px;outline:none}
.fg input:focus,.fg select:focus{border-color:#3b82f6}
.ir{display:flex;gap:6px}.ir input{flex:1}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
</style>
</head>
<body>

<div id="header">
  <span class="logo">项目档案管理器</span>
  <div style="display:flex;align-items:center;gap:6px">
    <input id="keywordInput" placeholder="识别关键字">
    <button class="btn btn-sm btn-primary" onclick="applyKeyword()">应用并扫描</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="sidebar-hdr"><span>项目列表</span><span class="badge" id="projectCount">0</span></div>
    <input id="searchInput" placeholder="搜索项目..." oninput="renderProjectList()">
    <div id="projectList"></div>
    <div class="sidebar-btns">
      <button class="btn btn-sm btn-primary" onclick="showProjectDlg(-1)">+ 新建</button>
      <button class="btn btn-sm btn-outline" onclick="if(sel>=0)showProjectDlg(sel)">编辑</button>
      <button class="btn btn-sm btn-outline" onclick="delProject()">删除</button>
      <button class="btn btn-sm btn-accent" onclick="showImportDlg()">批量导入</button>
    </div>
  </div>
  <div id="rightPanel">
    <div class="empty">请从左侧选择项目，或新建项目</div>
  </div>
</div>
<div id="statusBar"><span id="statusText">就绪</span></div>

<div class="modal-overlay" id="modalOverlay"><div class="modal-box">
  <div class="modal-hdr"><span id="modalTitle"></span><button class="btn btn-sm btn-outline" onclick="closeModal()">✕</button></div>
  <div class="modal-body" id="modalBody"></div>
</div></div>

<script src="/js/app.js"></script>
</body>
</html>
